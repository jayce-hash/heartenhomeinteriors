# Hearten Home Interiors - portfolio editor configuration.
# Bonnie only ever sees the "Portfolio Projects" collection below, so there is
# nothing else on the site she can reach or accidentally change.

backend:
  name: git-gateway      # email/password login via Netlify Identity (no GitHub account needed)
  branch: main

media_folder: "images/projects"      # where uploaded photos are stored
public_folder: "/images/projects"

publish_mode: simple
site_url: https://heartenhome.com    # update to the real domain during the domain pass

collections:
  - name: "projects"
    label: "Portfolio Projects"
    label_singular: "Project"
    editor: { preview: false }
    description: "Add, edit, or remove the homes shown on your portfolio page."
    folder: "projects"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}}  -  {{location}}"
    sortable_fields: ["order", "title"]
    fields:
      - label: "Project Name"
        name: "title"
        widget: "string"
        hint: "The name shown on the project, e.g. A Kitchen Built for Sunday Mornings."

      - label: "Service Type"
        name: "service"
        widget: "select"
        hint: "Pick the type of project."
        options:
          - "Turn-Key Renovation"
          - "Full-Service Design"
          - "Room Styling & Furnishings"
          - "Holiday & Hosting Readiness"

      - label: "Location"
        name: "location"
        widget: "string"
        hint: "City and state, e.g. Southlake, TX."

      - label: "Year"
        name: "year"
        widget: "string"
        required: false
        hint: "Optional. The year the project was finished."

      - label: "Cover Photo"
        name: "cover"
        widget: "image"
        hint: "The main photo for this project. Don't worry about photo size, it's resized automatically."

      - label: "Short Description"
        name: "summary"
        widget: "text"
        hint: "Two or three sentences about the home and the family."

      - label: "Gallery Photos"
        name: "gallery"
        widget: "list"
        required: false
        label_singular: "Photo"
        summary: "{{fields.image}}"
        field: { label: "Photo", name: "image", widget: "image" }
        hint: "Add as many room photos as you like. Drag to reorder them."

      - label: "Display Order"
        name: "order"
        widget: "number"
        required: false
        default: 1
        value_type: "int"
        hint: "Lower numbers show first on the portfolio page. Leave at 1 if you're not sure."

